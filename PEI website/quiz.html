<!DOCTYPE html>
<html lang="en">
<head>
     <link rel="stylesheet" href="style.css">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quiz </title>
    <a href="index.html" class="back-button">Home</a>
   
   <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f7f7f7;
            padding: 20px;
        }
        .quiz-container {
            background-color: #fff;
            max-width: 600px;
            margin: auto;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        }
        h1 {
            text-align: center;
        }
        .question {
            margin-bottom: 20px;
        }
        .options label {
            display: block;
            margin-bottom: 8px;
        }
        button {
            display: block;
            margin: 20px auto;
            padding: 10px 20px;
            font-size: 16px;
            cursor: pointer;
        }
        #result {
            text-align: center;
            font-size: 18px;
            margin-top: 20px;
            font-weight: bold;
        }
    </style>
</head>
<body>
    <div class="quiz-container">
        <h1>Quiz</h1>

        
        <div class="question">
            <p>1. what 3 languages are websites typically made with?</p>
            <div class="options">
                <label><input type="radio" name="q1" value="a"> HTML, CSS, JavaScript</label>
                <label><input type="radio" name="q1" value="b">HTML,Lua, Python</label>
                <label><input type="radio" name="q1" value="c"> CSS, C#, C++</label>
                <label><input type="radio" name="q1" value="d"> HTML, CSS, Java</label>
            </div>
        </div>

        <div class="question">
            <p>2. which of these tags dont need a closing tag?</p>
            <div class="options">
                <label><input type="radio" name="q2" value="a"> p</label>
                <label><input type="radio" name="q2" value="b"> br</label>
                <label><input type="radio" name="q2" value="c"> H1</label>
                <label><input type="radio" name="q2" value="d"> a </label>
            </div>
        </div>

        <div class="question">
    <p>3. what section do you link the a stylesheet in?</p>
    <div class="options">
        <label><input type="radio" name="q3" value="a"> Head</label>
        <label><input type="radio" name="q3" value="b"> Body</label>
        <label><input type="radio" name="q3" value="c"> The end</label>
        <label><input type="radio" name="q3" value="d"> DOCTYPE</label>
    </div>
</div>

<div class="question">
    <p>4. What can JavaScript realistically do?</p>
    <div class="options">
        <label><input type="radio" name="q4" value="a"> structure the website</label>
        <label><input type="radio" name="q4" value="b"> apply styles to HTML elements</label>
        <label><input type="radio" name="q4" value="c"> make websites more dynamic/interactive</label>
        <label><input type="radio" name="q4" value="d"> create paragraphs or headers</label>
    </div>
</div>

<div class="question">
    <p>5. Which of these does NOT function as a proper name for an html file?</p>
    <div class="options">
        <label><input type="radio" name="q5" value="a"> index.html</label>
        <label><input type="radio" name="q5" value="b"> style.html</label>
        <label><input type="radio" name="q5" value="c"> css.html</label>
        <label><input type="radio" name="q5" value="d"> html.css</label>
    </div>
</div>

        <button onclick="checkAnswers()">Submit Quiz</button>
        <div id="result"></div>
    </div>

    <script>
        function checkAnswers() {
            let score = 0;

           
            const answers = {
                q1: 'a', 
                q2: 'b', 
                q3: 'a',
                q4: 'c',
                q5: 'd',
            };

            for (let q in answers) {
                let selected = document.querySelector(`input[name="${q}"]:checked`);
                if (selected && selected.value === answers[q]) {
                    score++;
                }
            }

            const total = Object.keys(answers).length;
            document.getElementById('result').innerText = `You scored ${score} out of ${total}!`;
        }
    </script>
</body>
</html>
